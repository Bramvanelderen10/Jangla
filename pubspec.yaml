name: jangla
description: Jangla — learn basic Bengali and Japanese vocabulary and phrases.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Bundles config.json + every content.<code>.json. Adding a new language
    # file to this folder makes it available without editing pubspec.
    - assets/content/

# Launcher icons. Sources are generated by tool/generate_icon.py; regenerate
# the per-platform icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#00695C"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#00695C"
    theme_color: "#00695C"
