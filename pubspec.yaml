name: jangla
description: Jangla — learn basic Bengali and Japanese vocabulary and phrases.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundles config.json + every content.<code>.json. Adding a new language
    # file to this folder makes it available without editing pubspec.
    - assets/content/
